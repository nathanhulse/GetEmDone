name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select submission-compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create CI simulator
        run: |
          xcrun simctl create \
            'GetEmDone CI' \
            'iPhone 17 Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-26-2'

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project GetEmDone.xcodeproj \
            -scheme GetEmDone \
            -destination 'platform=iOS Simulator,name=GetEmDone CI,OS=26.2' \
            -derivedDataPath .DerivedData \
            -resultBundlePath TestResults/GetEmDone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GetEmDone-xcresult
          path: TestResults/GetEmDone.xcresult
          if-no-files-found: warn
          retention-days: 14
