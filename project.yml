name: GetEmDone
options:
  bundleIdPrefix: com.getemdone
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  GetEmDone:
    type: application
    platform: iOS
    sources: [GetEmDone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getemdone.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GetEmDone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  GetEmDoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GetEmDoneTests]
    dependencies:
      - target: GetEmDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getemdone.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  GetEmDone:
    build:
      targets:
        GetEmDone: all
        GetEmDoneTests: [test]
    test:
      targets:
        - GetEmDoneTests

